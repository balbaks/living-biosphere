world:
  width: 100
  height: 100
  max_ticks: 0  # 0 = run forever
  tick_speed_ms: 100
  save_interval: 100  # ticks between periodic fossil snapshots (each fossil event, snapshot or otherwise, writes to SQLite immediately)
  db_path: "data/biosphere.db"  # set to null/omit to disable persistence (used by isolated test scripts)

resources:
  base_regen_rate: 0.02
  max_cell_energy: 100.0
  regen_clusters: true
  cluster_size: 5

creatures:
  initial_population: 50
  max_population: 500
  base_energy: 50.0
  energy_cost_move: 1.0
  energy_cost_live: 0.5
  energy_gain_eat: 15.0
  repro_threshold: 80.0
  repro_cost: 40.0
  max_age: 500

genome:
  # [move_eff, size, diet_type, repro_thresh, aggression, mut_rate]
  min_values: [0.1, 0.5, 0.0, 30.0, 0.0, 0.001]
  max_values: [2.0, 3.0, 1.0, 100.0, 1.0, 0.1]
  default_mut_rate: 0.02

species:
  target_count_min: 3
  target_count_max: 15
  neat_compat_threshold: 3.0
  min_cluster_size: 5
  survival_generations: 3

intervention:
  enabled: true
  shock_probability: 0.0003  # per tick -- tuned for ~10% shock coverage (rare/notable), was 0.001 (produced 35-48% coverage)
  announcement_lead_ticks: 500
  temp_floor: 0.15  # combined temperature multiplier never drops below this, even with stacked shocks
  temp_ceiling: 2.5  # combined temperature multiplier never rises above this
  shock_types:
    - name: "ice_age"
      temp_drop: 0.5      # multiplies baseline temperature (a regen-formula input) -- NOT a flat "average cut"; see refugia_fraction below for why
      duration_ticks: 350  # reverts automatically after this many ticks -- tuned for zero-rescue survivability, was 800
      resource_clump: true       # gates whether regen is split into refugia/non-refugia zones (below) vs applied uniformly
      refugia_fraction: 0.15     # fraction of cells (top-N by current resource level) that get the bonus multiplier instead of the penalty.
                                  # Set to match the OLD mean-based split's measured average (0.1512, sampled every tick during
                                  # active ice_age windows, 3 seeds, n=13282) so the percentile refactor reproduced existing dynamics
                                  # rather than changing them. Left unchanged during severity tuning -- genuine scarcity, not a dial.
      refugia_bonus_mult: 2.0    # regen multiplier for refugia cells (unchanged -- untuned knob, refugia cells were already survivable)
      refugia_penalty_mult: 0.85 # regen multiplier for non-refugia cells -- tuned for zero-rescue survivability, was 0.2
    - name: "heat_wave"
      temp_rise: 1.5       # multiplies temperature while active (was 0.5 — inverted, cooled instead of warmed)
      duration_ticks: 800  # reverts automatically after this many ticks
    - name: "famine"
      resource_regen_mult: 0.65  # tuned for zero-rescue survivability, was 0.2 -- this was proposed and verified earlier but never applied until now
      duration_ticks: 600        # tuned for zero-rescue survivability, was 1000

rng:
  seed: null  # null = random, set for reproducible runs
